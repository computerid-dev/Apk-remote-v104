name: Build APK

# Workflow ini build APK debug tanpa perlu Android Studio / gradlew lokal.
# Jalan otomatis kalau ada push ke branch main, atau bisa dipicu manual
# lewat tab "Actions" -> pilih workflow ini -> "Run workflow".
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install paket Android SDK yang dibutuhkan
        # Runner ubuntu-latest sudah punya Android SDK bawaan, tapi lokasi
        # binary sdkmanager bisa beda-beda tergantung versi cmdline-tools
        # yang terpasang, jadi kita cari otomatis dulu.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di runner ini!"
            exit 1
          fi

          echo "Pakai sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Repo ini tidak menyertakan gradlew/gradle-wrapper.jar, jadi
          # Gradle-nya di-install langsung oleh action ini.
          gradle-version: '8.13'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemoteBT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
